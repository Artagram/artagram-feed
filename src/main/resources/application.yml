server:
  port: ${PORT:8083}

spring:
  application:
    name: artagram-feed

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:db_feed}
    username: ${DB_USER:artagram}
    password: ${DB_PASSWORD:artagram}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      # El tope real por plan lo aplica PlanService; este es el maximo del plan PRO.
      max-file-size: 25MB
      max-request-size: 280MB

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:artagram}
    password: ${RABBITMQ_PASSWORD:artagram_secret}

artagram:
  jwt:
    public-key-path: ${JWT_PUBLIC_KEY_PATH:../artagram-infra/secrets-dev/jwt-public.pem}
    public-key-pem: ${JWT_PUBLIC_KEY_PEM:}
  storage:
    type: ${STORAGE_TYPE:s3}
    endpoint: ${S3_ENDPOINT:}
    public-endpoint: ${S3_PUBLIC_ENDPOINT:}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:artagram-uploads}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    path-style-access: ${S3_PATH_STYLE:true}
    local-dir: ${STORAGE_LOCAL_DIR:uploads}
  ia:
    groq-api-key: ${GROQ_API_KEY:}
    groq-model: ${GROQ_MODEL:qwen/qwen3.8-27b}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
